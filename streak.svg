<svg xmlns="http://www.w3.org/2000/svg" width="620" height="80" viewBox="0 0 620 80">
  <rect width="620" height="80" fill="transparent"/>
  
  <!-- Current Streak -->
  <text x="155" y="35" font-family="'JetBrains Mono','SF Mono','Fira Code','Consolas',monospace" font-size="32" font-weight="700" fill="#c9d1d9" text-anchor="middle" opacity="0">
    1
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.2s" fill="freeze"/>
  </text>
  <text x="155" y="55" font-family="'JetBrains Mono','SF Mono','Fira Code','Consolas',monospace" font-size="11" fill="#8b949e" text-anchor="middle" opacity="0">
    current streak
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.4s" fill="freeze"/>
  </text>
  <text x="155" y="70" font-family="'JetBrains Mono','SF Mono','Fira Code','Consolas',monospace" font-size="9" fill="#6e7681" text-anchor="middle" opacity="0">
    Aug 3 – Aug 3
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.5s" fill="freeze"/>
  </text>
  
  <!-- Divider -->
  <line x1="310" y1="10" x2="310" y2="10" stroke="#30363d" stroke-width="1">
    <animate attributeName="y2" from="10" to="70" dur="0.6s" begin="0.3s" fill="freeze"/>
  </line>
  
  <!-- Longest Streak -->
  <text x="465" y="35" font-family="'JetBrains Mono','SF Mono','Fira Code','Consolas',monospace" font-size="32" font-weight="700" fill="#c9d1d9" text-anchor="middle" opacity="0">
    8
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.3s" fill="freeze"/>
  </text>
  <text x="465" y="55" font-family="'JetBrains Mono','SF Mono','Fira Code','Consolas',monospace" font-size="11" fill="#8b949e" text-anchor="middle" opacity="0">
    longest streak
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.5s" fill="freeze"/>
  </text>
  <text x="465" y="70" font-family="'JetBrains Mono','SF Mono','Fira Code','Consolas',monospace" font-size="9" fill="#6e7681" text-anchor="middle" opacity="0">
    Jun 7 – Jun 14
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.6s" fill="freeze"/>
  </text>
</svg>